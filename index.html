<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lớp Game Python</title>
<link rel="icon" href="favicon.png">
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --text: #1a1d23; --muted: #5f6673;
    --border: #e2e5ea; --accent: #3b5bdb; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --surface: #181b21; --text: #eceef2; --muted: #9aa1ad;
            --border: #2a2e37; --accent: #748ffc; --shadow: 0 4px 16px rgba(0,0,0,.4); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 40px 16px 64px; }
  header h1 { margin: 0 0 6px; font-size: clamp(26px, 4vw, 36px); letter-spacing: -.02em; }
  header p { margin: 0 0 28px; color: var(--muted); }
  .grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
          overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column;
          transition: transform .15s ease; }
  .card:hover { transform: translateY(-3px); }
  .cover { height: 130px; display: grid; place-items: center; font-size: 56px; color: #fff; }
  .body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .tag { align-self: flex-start; font-size: 12px; font-weight: 600; padding: 2px 8px;
         border-radius: 99px; background: var(--bg); color: var(--muted); border: 1px solid var(--border); }
  .card h2 { margin: 4px 0 0; font-size: 19px; }
  .author { color: var(--muted); font-size: 14px; margin: 0; }
  .desc { margin: 4px 0 12px; font-size: 14px; flex: 1; }
  .actions { display: flex; gap: 8px; }
  .btn { flex: 1; text-align: center; padding: 9px 12px; border-radius: 9px; font-weight: 600;
         font-size: 14px; text-decoration: none; cursor: pointer; border: 1px solid var(--border);
         background: var(--surface); color: var(--text); font-family: inherit; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* Player */
  #player { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; z-index: 10; }
  #player.open { display: flex; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #111; color: #eee; }
  .bar strong { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .btn { flex: none; background: #222; color: #eee; border-color: #333; }
  #frame { flex: 1; width: 100%; border: 0; background: #000; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 28px; }
  code { background: var(--surface); border: 1px solid var(--border); padding: 1px 5px; border-radius: 5px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎮 Lớp Game Python</h1>
    <p>Tất cả game của các bạn trong lớp, chơi ngay trên trình duyệt. Bấm “Chơi” để bắt đầu.</p>
  </header>
  <main class="grid" id="grid"></main>
  <p class="hint">Thêm game mới: build bằng pygbag, chép thư mục <code>build/web</code> vào <code>games/&lt;ten-game&gt;/</code>, rồi thêm một dòng vào <code>games/games.json</code>.</p>
</div>

<div id="player" role="dialog" aria-label="Đang chơi game">
  <div class="bar">
    <button class="btn" id="back">← Quay lại</button>
    <strong id="ptitle"></strong>
    <button class="btn" id="full">Toàn màn hình</button>
    <a class="btn" id="newtab" target="_blank" rel="noopener">Mở tab mới</a>
  </div>
  <iframe id="frame" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
</div>

<script>
const grid = document.getElementById('grid');
const player = document.getElementById('player');
const frame = document.getElementById('frame');

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }

function render(games) {
  grid.innerHTML = '';
  for (const g of games) {
    const url = `games/${g.id}/index.html`;
    const card = el('article', 'card');
    const cover = el('div', 'cover', g.emoji || '🎮');
    cover.style.background = `linear-gradient(135deg, ${g.color || '#3b5bdb'}, #1a1d23)`;
    const body = el('div', 'body');
    body.append(el('span', 'tag', g.tag || 'Game'), el('h2', '', g.title),
                el('p', 'author', 'Tác giả: ' + g.author), el('p', 'desc', g.description || ''));
    const actions = el('div', 'actions');
    const play = el('button', 'btn primary', '▶ Chơi');
    play.onclick = () => openGame(g, url);
    const tab = el('a', 'btn', 'Tab mới'); tab.href = url; tab.target = '_blank'; tab.rel = 'noopener';
    actions.append(play, tab);
    body.append(actions);
    card.append(cover, body);
    grid.append(card);
  }
}

function openGame(g, url) {
  document.getElementById('ptitle').textContent = `${g.title} — ${g.author}`;
  document.getElementById('newtab').href = url;
  frame.src = url;
  player.classList.add('open');
  history.pushState({ game: g.id }, '', '#' + g.id);
  frame.focus();
}
function closeGame() { player.classList.remove('open'); frame.src = 'about:blank'; }

document.getElementById('back').onclick = () => history.state?.game ? history.back() : closeGame();
document.getElementById('full').onclick = () => (frame.requestFullscreen || frame.webkitRequestFullscreen).call(frame);
window.addEventListener('popstate', () => { if (!location.hash) closeGame(); });

fetch('games/games.json', { cache: 'no-cache' })
  .then(r => r.json())
  .then(games => {
    render(games);
    const g = games.find(x => '#' + x.id === location.hash);
    if (g) openGame(g, `games/${g.id}/index.html`);
  })
  .catch(() => { grid.innerHTML = '<p>Không tải được danh sách game (games/games.json). Hãy chạy qua web server, không mở file trực tiếp.</p>'; });
</script>
</body>
</html>
